name: Build PS3

on:
  workflow_dispatch:

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PATH
        run: |
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Cache do toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-toolchain-v1

      - name: Dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make \
            texinfo libncurses5-dev patch python-is-python3 subversion wget zlib1g-dev \
            libtool-bin python3-dev bzip2 libgmp3-dev pkg-config g++ libssl-dev git

      - name: Montar toolchain (demora)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER /usr/local/ps3dev
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Mostrar estrutura dos exemplos SPU
        run: |
          find / -type d -path "*samples*" -name "spu*" 2>/dev/null | head -20
          ls /usr/local/ps3dev
          ls /usr/local/ps3dev/bin | head -50
